services:
  - type: web
    name: eairn-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python -m eairn.seed.bootstrap
    startCommand: uvicorn eairn.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
  - type: web
    name: eairn-portal
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: EAIRN_API_URL
        value: https://eairn-api.onrender.com
      - key: NODE_VERSION
        value: 22
      - key: PORT
        value: 3000
